services:
  # PostgreSQL Database
  - type: postgres
    name: timetable-db
    plan: free
    ipAllowList: []

  # FastAPI Backend Web Service
  - type: web
    name: timetable-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timetable-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        value: "*"

  # Next.js Frontend Web Service
  - type: web
    name: timetable-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: timetable-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: timetable-backend
          property: host
