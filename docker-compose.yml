services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: timetable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-timetable_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-timetable_password}
      POSTGRES_DB: ${DB_NAME:-timetable_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-timetable_user} -d ${DB_NAME:-timetable_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timetable-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-timetable_user}:${DB_PASSWORD:-timetable_password}@db:5432/${DB_NAME:-timetable_db}
      SECRET_KEY: ${SECRET_KEY:-default-insecure-key-replace-in-production-12345}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      APP_NAME: "Timetable Generator"
      DEBUG: "False"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: timetable-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
